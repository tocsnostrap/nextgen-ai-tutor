services:
  - type: web
    name: nextgen-ai-tutor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # you enter this in the Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: nextgen-ai-tutor-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: REDIS_ENABLED
        value: false

databases:
  - name: nextgen-ai-tutor-db
    plan: free
    databaseName: ai_tutor
    user: ai_tutor
